name: Vinted Watcher

on:
  schedule:
    # Runs every 10 minutes. Adjust the cron expression to change frequency.
    # Cron is UTC. GitHub may delay runs by a few minutes during high load.
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min, offset from :00/:10/…
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

#refresh

permissions:
  contents: write  # needed so the workflow can commit the updated seen_items.json
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Commit updated seen items
        run: |
          git config user.name "vinted-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_items.json
          git diff --staged --quiet || git commit -m "Update seen items [skip ci]"
          git push
          
      - name: Keep workflow alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable watch.yml
